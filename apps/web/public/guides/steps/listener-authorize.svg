<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f4f6fc"/><g font-family="Arial,sans-serif" fill="#18213c"><text x="48" y="62" font-size="30" font-weight="700">Izinkan komputer pada layar HP</text><text x="48" y="102" font-size="19" fill="#64748b">ILUSTRASI langkah, bukan screenshot perangkat. Nama dan posisi menu dapat berbeda.</text><rect x="48" y="170" width="370" height="390" rx="24" fill="#fff" stroke="#d8deed" stroke-width="2"/><rect x="66" y="191" width="334" height="65" rx="12" fill="#5545e8"/><text x="81" y="232" fill="#fff" font-size="22" font-weight="700">1. Komputer</text><rect x="66" y="291" width="334" height="80" rx="12" fill="#efedff"/><text x="79" y="338" font-size="18">adb devices</text><text x="72" y="423" font-size="18">Jalankan dari folder platform-tools</text><rect x="453" y="170" width="370" height="390" rx="24" fill="#fff" stroke="#d8deed" stroke-width="2"/><rect x="471" y="191" width="334" height="65" rx="12" fill="#5545e8"/><text x="486" y="232" fill="#fff" font-size="22" font-weight="700">2. Layar HP</text><rect x="471" y="291" width="334" height="80" rx="12" fill="#efedff"/><text x="484" y="338" font-size="18">Allow USB debugging?</text><text x="477" y="423" font-size="18">Izinkan komputer pribadi Anda</text><rect x="858" y="170" width="370" height="390" rx="24" fill="#fff" stroke="#d8deed" stroke-width="2"/><rect x="876" y="191" width="334" height="65" rx="12" fill="#5545e8"/><text x="891" y="232" fill="#fff" font-size="22" font-weight="700">3. Komputer</text><rect x="876" y="291" width="334" height="80" rx="12" fill="#efedff"/><text x="889" y="338" font-size="18">SERIAL_CONTOH    device</text><text x="882" y="423" font-size="18">device = koneksi ADB siap</text><text x="48" y="636" font-size="21">Ikuti teks dan perintah pada langkah ini. Gunakan komputer serta HP toko Anda sendiri.</text></g></svg>